<text x="40" y="660" font-size="13" fill="#0f172a" font-weight="bold">Permissions by role</text>
<text x="40" y="682" font-size="12" fill="#0f172a">USER: create tickets, view/update/comment own tickets.</text>
<text x="40" y="700" font-size="12" fill="#0f172a">AGENT: view all tickets, change status, assign, comment, view statistics.</text>
<text x="40" y="718" font-size="12" fill="#0f172a">ADMIN: everything an AGENT can do, plus delete tickets and manage users/roles.</text>
