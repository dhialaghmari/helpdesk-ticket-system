services:
  mysql:
    image: mysql:8.4
    container_name: helpdesk-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: helpdesk
      MYSQL_USER: ${DB_USERNAME:-helpdesk}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - helpdesk-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  helpdesk-mysql-data: